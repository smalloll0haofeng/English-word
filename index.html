<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#78967a">
<title>單字小練習｜Word Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap');
:root{font-family:'DM Sans','Noto Sans TC',sans-serif;color:#27332f;background:#f5f3ed;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-width:320px;background:#f5f3ed}button,input{font:inherit}button{cursor:pointer}.app-shell{min-height:100vh;background:radial-gradient(circle at 83% 4%,rgba(219,230,209,.65),transparent 30%),#f5f3ed;padding:0 6vw 30px;position:relative;overflow:hidden}.app-shell:before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.23;background-image:radial-gradient(#a6a794 .7px,transparent .7px);background-size:8px 8px;mask-image:linear-gradient(to bottom,#000,transparent 80%)}.topbar,.hero-copy,.quiz-layout,.footer-note{position:relative;z-index:1;max-width:1180px;margin-inline:auto}.topbar{height:104px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(39,51,47,.11)}.brand{display:flex;gap:13px;align-items:center}.brand-mark{width:42px;height:42px;display:grid;place-items:center;color:#f6f3e9;background:#78967a;border-radius:13px 13px 13px 5px;box-shadow:0 7px 17px rgba(70,97,72,.18);font-size:19px}.eyebrow{letter-spacing:.19em;font-size:10px;font-weight:700;margin:0 0 3px;color:#6b776f}.brand h1{font-family:'Noto Serif TC',serif;font-size:20px;margin:0;letter-spacing:.07em}.top-actions{display:flex;align-items:center;gap:20px}.question-count{color:#79857c;font-size:13px}.icon-button{border:1px solid #d8ded3;color:#607063;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.4);display:grid;place-items:center;transition:.18s ease}.icon-button:hover{background:#e2eadc;transform:rotate(-16deg)}.hero-copy{padding:78px 0 52px}.accent{color:#78967a}.hero-copy h2{font-family:'Noto Serif TC',serif;font-weight:600;font-size:clamp(34px,5vw,58px);letter-spacing:.03em;line-height:1.3;margin:10px 0 13px;color:#283833}.hero-copy h2 em{color:#78967a;font-style:normal}.hero-subtitle{font-size:15px;color:#7d857d;margin:0;letter-spacing:.04em}.quiz-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:clamp(35px,7vw,105px);align-items:start}.progress-panel{padding-top:11px}.progress-heading{display:flex;justify-content:space-between;align-items:baseline;color:#8b948c;font-size:12px;letter-spacing:.08em}.progress-heading strong{color:#40574a;font-size:19px;letter-spacing:0}.progress-heading small{color:#a9b0a9;font-size:11px;font-weight:400}.progress-track{height:4px;background:#dfe4db;border-radius:6px;margin:15px 0 27px;overflow:hidden}.progress-fill{height:100%;background:#78967a;border-radius:inherit;transition:width .3s cubic-bezier(.23,1,.32,1)}.progress-list{display:grid;gap:14px}.progress-dot{display:flex;align-items:center;gap:12px;color:#adb4ac;font-size:12px;transition:.2s ease}.progress-dot span{width:27px;height:27px;display:grid;place-items:center;border:1px solid #d5dbd1;border-radius:50%;font-size:9px}.progress-dot.active{color:#40574a;font-weight:700}.progress-dot.active span{border:5px solid #bdd0b9;background:#78967a;color:white}.progress-dot.done{color:#78967a}.progress-dot.done span{background:#e2ebdf;border-color:#bcd0ba}.tip-card{display:flex;gap:10px;margin-top:45px;padding:15px;background:rgba(225,235,222,.53);border-radius:9px;color:#78967a}.tip-card p{margin:0;font-size:11px;line-height:1.7;color:#86928a}.tip-card b{color:#617568;font-weight:600}.quiz-card{min-height:465px;padding:38px clamp(28px,5.5vw,78px) 43px;background:rgba(255,255,252,.88);border:1px solid rgba(210,218,207,.9);border-radius:5px 32px 5px 32px;box-shadow:0 22px 45px rgba(71,86,73,.08)}.card-meta{display:flex;justify-content:space-between;color:#aab2a9;letter-spacing:.14em;font-size:10px;font-weight:700}.sound-hint{display:flex;align-items:center;gap:6px;color:#b5bcb5;letter-spacing:.03em;font-weight:500}.prompt-area{padding:51px 0 38px}.prompt-label,.answer-label{color:#a4ada4;font-size:12px;margin:0 0 12px;letter-spacing:.06em}.prompt-area h3{font-family:'Noto Serif TC',serif;font-size:clamp(42px,6vw,66px);line-height:1;color:#2f4439;margin:0;font-weight:600}.word-underline{width:43px;height:3px;background:#9fbea0;margin-top:22px}.answer-label{display:block;color:#647168;font-weight:600}.input-wrap{display:flex;align-items:center;border-bottom:1px solid #cfd8cc;transition:.2s ease}.input-wrap:focus-within{border-color:#78967a}.input-wrap.correct{border-color:#83a987}.input-wrap.wrong{border-color:#c6887f}.input-wrap input{flex:1;min-width:0;border:0;outline:0;color:#334a3d;background:transparent;padding:9px 0 12px;font-family:'Noto Serif TC',serif;font-size:20px}.input-wrap input::placeholder{color:#c4cbc3}.input-status{display:grid;place-items:center}.input-wrap.correct .input-status{color:#6e9d78}.input-wrap.wrong .input-status{color:#bc796e}.feedback{display:flex;gap:8px;align-items:center;margin-top:15px;font-size:13px;animation:rise .18s ease-out}.feedback-correct{color:#6a9870}.feedback-wrong{color:#b8776e}.feedback b{font-weight:700}.submit-button{margin-top:30px;display:inline-flex;gap:11px;align-items:center;border:0;background:#78967a;color:#fff;border-radius:5px 15px 5px 15px;padding:13px 21px;font-size:13px;font-weight:700;letter-spacing:.04em;box-shadow:0 7px 16px rgba(76,104,78,.18);transition:transform .16s ease-out,background .16s ease-out}.submit-button:hover{background:#66866b;transform:translateY(-2px)}.submit-button:active{transform:scale(.97)}.finish-state{text-align:center;padding:38px 0 15px}.finish-icon{width:64px;height:64px;display:grid;place-items:center;margin:0 auto 26px;color:#f4f7ed;background:#78967a;border-radius:50%;font-size:28px}.finish-state h3{font-family:'Noto Serif TC',serif;font-size:30px;margin:10px 0;color:#30443a}.finish-state p:not(.eyebrow){color:#849087;font-size:14px}.finish-state strong{color:#78967a;font-size:24px}.finish-state .submit-button{margin-top:24px}.footer-note{text-align:center;color:#9da69e;font-size:11px;letter-spacing:.03em;padding-top:32px}.loading-shell{display:grid;place-items:center}.loader-mark{display:flex;gap:10px;align-items:center;color:#78967a;font-size:14px;animation:pulse 1.2s ease-in-out infinite}@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{opacity:.45}}@media(max-width:750px){.app-shell{padding:0 20px 24px}.topbar{height:82px}.question-count{display:none}.hero-copy{padding:55px 0 38px}.hero-copy h2{font-size:37px}.quiz-layout{display:flex;flex-direction:column-reverse;gap:24px}.quiz-card{width:100%;min-height:430px;padding:28px 24px 32px}.progress-panel{width:100%;padding:0 3px}.progress-list{display:flex;overflow:hidden;gap:9px}.progress-dot{flex:1;display:block;text-align:center}.progress-dot span{margin:auto}.progress-dot label{display:none}.tip-card{margin-top:22px}.prompt-area{padding:45px 0 34px}.footer-note{line-height:1.6}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app=document.getElementById('app');
const shuffle=items=>[...items].sort(()=>Math.random()-.5);
const lines=text=>text.split(/\r?\n/).map(line=>line.trim()).filter(Boolean);
const escapeHtml=value=>String(value).replace(/[&<>'"]/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
let questions=[],current=0,answer='',submitted=false,results=[];
let successAudio,errorAudio;
function renderLoading(){app.innerHTML='<main class="app-shell loading-shell"><div class="loader-mark">✦ <span>正在準備題目</span></div></main>'}
function renderFilePicker(){app.innerHTML='<main class="app-shell loading-shell"><div class="quiz-card" style="max-width:620px;text-align:center"><div class="finish-icon">!</div><p class="eyebrow accent">LOCAL FILE MODE</p><h3 style="font-family:\'Noto Serif TC\',serif;color:#30443a">請選取題目檔案</h3><p style="color:#849087;line-height:1.9">直接雙擊 index.html 時，瀏覽器不允許網頁自動讀取同資料夾檔案。請一次選取 <b>topicE.txt</b> 和 <b>topicC.txt</b>。</p><input id="local-files" type="file" accept=".txt,text/plain" multiple style="margin:16px 0;max-width:100%"><p id="local-status" style="color:#849087;font-size:13px">尚未選取檔案</p></div></main>';document.getElementById('local-files').addEventListener('change',async event=>{const files=[...event.target.files];const english=files.find(file=>file.name.toLowerCase()==='topice.txt');const chinese=files.find(file=>file.name.toLowerCase()==='topicc.txt');const status=document.getElementById('local-status');if(!english||!chinese){status.textContent='請同時選取檔名完全為 topicE.txt 和 topicC.txt 的兩個檔案。';return}const englishLines=lines(await english.text()),chineseLines=lines(await chinese.text());if(!englishLines.length||englishLines.length!==chineseLines.length){status.textContent='兩個檔案都不能空白，且行數必須相同。';return}questions=shuffle(englishLines.map((word,index)=>({word,answer:chineseLines[index]})));current=0;answer='';submitted=false;results=[];successAudio=new Audio('O.mp3');errorAudio=new Audio('X.mp3');render()})}
async function loadQuestions(){if(location.protocol==='file:'){renderFilePicker();return}renderLoading();try{const cache=Date.now();const [english,chinese]=await Promise.all([fetch('topicE.txt?cache='+cache),fetch('topicC.txt?cache='+cache)]);if(!english.ok||!chinese.ok)throw Error('找不到 topicE.txt 或 topicC.txt');const englishLines=lines(await english.text()),chineseLines=lines(await chinese.text());if(!englishLines.length)throw Error('topicE.txt 和 topicC.txt 不能是空白檔案');if(englishLines.length!==chineseLines.length)throw Error('兩個檔案的行數必須相同');questions=shuffle(englishLines.map((word,index)=>({word,answer:chineseLines[index]})));current=0;answer='';submitted=false;results=[];successAudio=new Audio('O.mp3');errorAudio=new Audio('X.mp3');render()}catch(error){app.innerHTML='<main class="app-shell loading-shell"><div class="quiz-card" style="max-width:620px;text-align:center"><div class="finish-icon">!</div><p class="eyebrow accent">FILES NOT FOUND</p><h3 style="font-family:\'Noto Serif TC\',serif;color:#30443a">請準備題目檔案</h3><p style="color:#849087;line-height:1.9">請把 <b>topicE.txt</b> 和 <b>topicC.txt</b> 放在 index.html 的同一個資料夾，且兩個檔案的行數必須相同。</p><p style="color:#849087;font-size:13px">錯誤：'+escapeHtml(error.message)+'</p></div></main>'}}
function submit(){if(!questions[current]||submitted||!answer.trim())return;const question=questions[current],correct=answer.trim().toLowerCase()===question.word.trim().toLowerCase();results.push({word:question.word,expected:question.word,given:answer.trim(),correct});submitted=true;const audio=correct?successAudio:errorAudio;if(audio){audio.currentTime=0;audio.play().catch(()=>{})}render()}
function next(){current++;answer='';submitted=false;render()}
function restart(){loadQuestions()}
function render(){const question=questions[current],finished=current>=questions.length,score=results.filter(result=>result.correct).length,progress=questions.length?Math.min(((current+(submitted?1:0))/questions.length)*100,100):0;app.innerHTML=`<main class="app-shell"><header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><p class="eyebrow">WORD STUDIO</p><h1>單字小練習</h1></div></div><div class="top-actions"><span class="question-count">${questions.length} 題練習</span><button class="icon-button" id="restart" aria-label="重新開始">↻</button></div></header><section class="hero-copy"><p class="eyebrow accent">TODAY'S PRACTICE</p><h2>把每個單字，<em>記得更牢。</em></h2><p class="hero-subtitle">題目已經打亂，看著中文提示，寫出正確的英文單字吧。</p></section><section class="quiz-layout"><aside class="progress-panel"><div class="progress-heading"><span>練習進度</span><strong>${finished?questions.length:current+1}<small> / ${questions.length}</small></strong></div><div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div><div class="progress-list">${questions.map((item,index)=>`<div class="progress-dot ${index<current?'done':''} ${index===current&&!finished?'active':''}"><span>${index<current?'✓':String(index+1).padStart(2,'0')}</span><label>${index<current?escapeHtml(item.word):index===current&&!finished?'現在這題':'待完成'}</label></div>`).join('')}</div><div class="tip-card">✦<p>小提醒<br><b>英文答案不分大小寫</b>，送出前可以再想一下。</p></div></aside><div class="quiz-card">${finished?`<div class="finish-state"><div class="finish-icon">✦</div><p class="eyebrow accent">PRACTICE COMPLETE</p><h3>今天的練習完成了！</h3><p>你答對了 <strong>${score}</strong> / ${questions.length} 題</p><button class="submit-button" id="restartFinish">↻ 再練一次</button></div>`:`<div class="card-meta"><span>QUESTION ${String(current+1).padStart(2,'0')}</span><span class="sound-hint">♬ 聽見正誤回饋</span></div><div class="prompt-area"><p class="prompt-label">根據中文寫出英文單字</p><h3>${escapeHtml(question.answer)}</h3><div class="word-underline"></div></div><form id="quiz-form"><label class="answer-label" for="answer">輸入英文單字</label><div class="input-wrap ${submitted?(results[results.length-1].correct?'correct':'wrong'):''}"><input id="answer" value="${escapeHtml(answer)}" placeholder="輸入英文單字" autocomplete="off" ${submitted?'disabled':''}><span class="input-status">${submitted?(results[results.length-1].correct?'✓':'×'):''}</span></div>${submitted?`<div class="feedback ${results[results.length-1].correct?'feedback-correct':'feedback-wrong'}">${results[results.length-1].correct?'✓ 答對了！很棒，繼續保持。':'× 再接再厲！正確答案是 <b>'+escapeHtml(question.word)+'</b>'}</div>`:''}<button class="submit-button" type="submit">${submitted?'下一題 →':'確認答案 →'}</button></form>`}</div></section><footer class="footer-note">題目來源：topicE.txt ＋ topicC.txt　·　每次開始都會重新打亂順序</footer></main>`;document.getElementById('restart')?.addEventListener('click',restart);document.getElementById('restartFinish')?.addEventListener('click',restart);const form=document.getElementById('quiz-form');form?.addEventListener('submit',event=>{event.preventDefault();submitted?next():submit()});const input=document.getElementById('answer');input?.addEventListener('input',event=>{answer=event.target.value});if(input&&!submitted)input.focus()}
loadQuestions();
</script>
</body>
</html>
